name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.73.0
          cache: true

      - name: Install Pixi environments
        run: pixi install --locked

      - name: Restore cydr compilation cache
        uses: actions/cache@v4
        with:
          path: .cydr_cache
          key: cydr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock') }}

      # Keep Python versions sequential on each runner.
      - name: Test Python 3.11
        run: pixi run -e py311 pytest -v

      - name: Test Python 3.12
        run: pixi run -e py312 pytest -v

      - name: Test Python 3.13
        run: pixi run -e py313 pytest -v

      - name: Test Python 3.14
        run: pixi run -e py314 pytest -v
