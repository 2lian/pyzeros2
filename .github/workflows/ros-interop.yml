name: ROS 2 interoperability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ros-interop:
    name: ROS 2 interop (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.73.0
          cache: true

      - name: Install Pixi environments
        run: pixi install --locked

      - name: Restore cydr compilation cache
        uses: actions/cache@v4
        with:
          path: .cydr_cache
          key: cydr-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pixi.lock') }}

      # Keep ROS distributions sequential on the same runner.
      - name: Test Jazzy interoperability
        run: pixi run -e jazzy pytest -v

      - name: Test Lyrical interoperability
        if: ${{ always() }}
        run: pixi run -e lyrical pytest -v
