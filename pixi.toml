[workspace]
authors = [ "Neppel Elian <elian.neppel@posteo.eu>" ]
channels = [ "https://prefix.dev/conda-forge" ]
name = "PyZeROS2"
platforms = [ "linux-64", "osx-arm64", "win-64" ]
version = "0.1.0"

[environments]
default = { features = [ "common", "test", "py312" ] }
py311 = { features = [ "common", "test", "py311" ] }
py312 = { features = [ "common", "test", "py312" ] }
py313 = { features = [ "common", "test", "py313" ] }
py314 = { features = [ "common", "test", "py314" ] }
jazzy = { features = [ "common", "test", "py312", "jazzy" ] }
lyrical = { features = [ "common", "test", "py314", "lyrical" ] }

[feature.common.activation.env]
ZENOH_ROUTER_CONFIG_URI = "./router.json5"
ZENOH_SESSION_CONFIG_URI = "./client.json5"
PYTHON_GIL = "1"

[feature.common.dependencies]
setuptools = ">=82.0.1,<83"
zenohd = ">=1.9.0,<2"

[feature.common.pypi-dependencies]
pyzeros = { path = ".", editable = true }

[feature.common.tasks]
router = "RUST_LOG=debug zenohd -c ./router.json5"

[feature.jazzy]
platforms = [ "linux-64" ]
channels = [ "https://prefix.dev/robostack-jazzy" ]

[feature.jazzy.activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
ROS_DOMAIN_ID = "0"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
ROS_LOCALHOST_ONLY = ""

[feature.jazzy.dependencies]
lark-parser = ">=0.12.0,<0.13"
ros-jazzy-ros-core = ">=0.11.0,<0.12"
ros-jazzy-ros2cli = ">=0.32.8,<0.33"
ros-jazzy-rmw-zenoh-cpp = ">=0.2.9,<0.3"

[feature.lyrical]
platforms = [ "linux-64" ]
channels = [ "https://prefix.dev/robostack-lyrical" ]

[feature.lyrical.activation.env]
RMW_IMPLEMENTATION = "rmw_zenoh_cpp"
ROS_DOMAIN_ID = "0"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
ROS_LOCALHOST_ONLY = ""

[feature.lyrical.dependencies]
lark-parser = ">=0.12.0,<0.13"
ros-lyrical-ros-core = ">=0.13.0,<0.14"
ros-lyrical-ros2cli = ">=0.40.7,<0.41"
ros-lyrical-rmw-zenoh-cpp = ">=0.10.4,<0.11"

[feature.py311.dependencies]
python = ">=3.11,<3.12"

[feature.py312.dependencies]
python = ">=3.12,<3.13"

[feature.py313.dependencies]
python = ">=3.13,<3.14"

[feature.py314.dependencies]
python = ">=3.14,<3.15"

[feature.test.dependencies]
pytest = ">=9.0.3,<10"
pytest-asyncio = ">=1.3.0,<2"

[feature.test.tasks]
pytest = "pytest"
